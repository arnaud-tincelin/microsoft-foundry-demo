# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: ai-demo

infra:
  provider: bicep
  path: infra
  module: main

services:
  game-session-tracker-api:
    project: ./game-session-tracker-api
    language: python
    host: containerapp
    docker:
      remoteBuild: true
      path: ./Dockerfile
      context: ./

hooks:
  postprovision:
    shell: sh
    run: ./hooks/postdeploy.sh
    continueOnError: false
