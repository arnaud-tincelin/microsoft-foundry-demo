[project]
name = "workflow"
version = "0.1.0"
description = "AI Foundry workflow"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv",
    "azure-ai-projects",
    "azure-identity",
    "openai",
    "requests",
]

[tool.uv]
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
