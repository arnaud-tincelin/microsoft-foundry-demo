[project]
name = "agent"
version = "0.1.0"
description = "AI agent demo with agent-framework"
requires-python = ">=3.13"
dependencies = [
    "agent-framework-core==1.0.0rc3",
    "azure-ai-agentserver-responses>=1.0.0b1,<2",
    "azure-identity>=1.25.1"
]

[tool.uv]
prerelease = "if-necessary"

[[tool.uv.index]]
name = "cfs"
url = "https://packagefeedproxy.microsoft.io/pypi/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
