[project]
name = "mcp-game-server"
version = "0.1.0"
description = "Game session tracker REST API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "azure-cosmos",
    "azure-identity",
]

[tool.uv]
prerelease = "if-necessary"

[[tool.uv.index]]
name = "cfs"
url = "https://packagefeedproxy.microsoft.io/pypi/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
